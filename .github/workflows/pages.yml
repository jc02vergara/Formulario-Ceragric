name: Desplegar GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Versionar archivos estáticos
        # GitHub Pages cachea 10 minutos; el sufijo ?v=<commit> evita mezclar HTML nuevo con JS viejo.
        run: |
          VERSION="${GITHUB_SHA::8}"
          find src -name '*.js' -not -path 'src/assets/vendor/*' -exec sed -E -i "s#(from '\.[^']+\.js)'#\1?v=${VERSION}'#g" {} +
          sed -E -i "s#((src|href)=\"(\.\./)?src/[^\"]+\.(js|css))\"#\1?v=${VERSION}\"#g" index.html panel/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
